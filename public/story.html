<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jumpi Story</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/jumpi-head-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/jumpi-head-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lilita+One&display=swap">
<style>
:root{--bg:#0d1a3a;--panel:#16264f;--ink:#ffffff;--muted:#a9bde6;--orange:#ff9a1f;--orange-edge:#a3410a;--red:#ff4545;--red-edge:#8a1c1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#1b3570,var(--bg) 70%);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;gap:28px;padding:16px;flex-wrap:wrap}
.stage{height:min(calc(100vh - 32px),1920px);aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgb(0 0 0 / .5),0 0 0 3px rgb(255 255 255 / .08);background:#000}
.stage canvas{width:100%;height:100%;display:block}
.side{display:flex;flex-direction:column;gap:14px;width:min(300px,100%)}
.side h1{margin:0;font:400 2rem/1 "Lilita One",sans-serif;letter-spacing:.03em}
.side p{margin:0;color:var(--muted);line-height:1.45}
.btn{border:0;border-radius:16px;padding:14px 18px;font:600 1.1rem "Fredoka",sans-serif;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px)}
.btn:focus-visible{outline:3px solid #ffd27a;outline-offset:3px}
.rec{background:var(--red);box-shadow:0 5px 0 var(--red-edge)}
.dl{background:var(--orange);box-shadow:0 5px 0 var(--orange-edge);font-size:1.25rem;padding:18px}
.replay.rec{background:#2c4468;box-shadow:0 5px 0 #1b2c47}
.replay.rec .dot{background:var(--red)}
.rec .dot{width:14px;height:14px;border-radius:50%;background:#fff}
.rec.on .dot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.replay{background:#2c4468;box-shadow:0 5px 0 #1b2c47}
.btn:disabled{opacity:.6;cursor:progress}
.status{min-height:1.4em;color:#ffd27a;font-weight:500}
.bar{height:8px;border-radius:4px;background:#2c4468;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--orange)}
@media (max-width:760px){.side{order:2}}
</style>
</head>
<body>
<div class="stage"><canvas id="out" width="1080" height="1920" aria-label="Jumpi story animation"></canvas></div>
<div class="side">
  <h1>JUMPI STORY</h1>
  <p>23-second vertical video (1080×1920) for Instagram Stories. Download makes a 1080×1920 MP4 with music and sound effects, ready for Instagram. It takes about a minute.</p>
  <button class="btn dl" id="dl" type="button"><span aria-hidden="true">⬇</span><span id="dlLabel">Download HD video</span></button>
  <button class="btn replay rec" id="rec" type="button"><span class="dot"></span><span id="recLabel">Record (real time)</span></button>
  <button class="btn replay" id="snd" type="button" aria-pressed="false">🔇 Sound off</button>
  <button class="btn replay" id="replay" type="button">Replay</button>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <p class="status" id="status" role="status"></p>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {RoundedBoxGeometry} from "three/addons/geometries/RoundedBoxGeometry.js";

const W=1080,H=1920,DUR=23.5;
const out=document.getElementById("out"),ctx=out.getContext("2d");

/* ---------- 3D setup ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(48,W/H,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x5aa0d8,1.4));
const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(3,8,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7});scene.add(sun);
const rim=new THREE.DirectionalLight(0x9fe3ff,1.4);rim.position.set(-4,3,-5);scene.add(rim);

const COLORS=[["Orange","#ff8a1c"],["Sky","#1fb6ff"],["Mint","#2fd36b"],["Bubblegum","#ff5fb4"],["Grape","#9b5cff"],["Sunny","#ffd23a"],["Cherry","#ff4545"],["Snow","#f2f6ff"],
  ["Chocolate","#5b3420"],["Caramel","#c27a3a"],["Peach","#f6c4a0"],["Mocha","#8a5a3c"],
  ["Midnight","#2a2f72",{rough:.3}],["Ruby Gloss","#c8102e",{rough:.12,metal:.1}],["Neon Glow","#39ff14",{emissive:"#22b80c",glow:.55}],["Solid Gold","#f2c230",{rough:.25,metal:.75,emissive:"#6b4a00",glow:.45}]];
const STARTER_COLORS=8,STARTER_EYES=8,STARTER_ITEMS=4;
function skinMaterial(m,idx){const [,hex,o={}]=COLORS[idx]||COLORS[0];m.color.set(hex);m.roughness=o.rough??.45;m.metalness=o.metal??0;
  m.emissive.set(o.emissive||"#000000");m.emissiveIntensity=o.glow??0;}
/* ---------- outfit: hair, shirts, pants, glasses (built in 3D, attached to the character's parts) ---------- */
const OUTFIT_PARTS={
  hair:   [{id:"spiky",name:"Spiky (boy)"},{id:"quiff",name:"Quiff (boy)"},{id:"pigtails",name:"Pigtails (girl)"},{id:"longbow",name:"Long with bow (girl)"},
           {id:"spiky",name:"Electric Spiky",col:["#1f6bff","#59a0ff"]},{id:"quiff",name:"Platinum Quiff",col:["#e9dfc4","#fffaf0"]},{id:"pigtails",name:"Pink Pigtails",col:["#ff5fa8","#ff9ccc"]},{id:"longbow",name:"Violet Waves",col:["#7b3fe4","#a77bff"]}],
  shirt:  [{id:"red",name:"Red tee"},{id:"sailor",name:"Sailor stripes"},{id:"hoodie",name:"Green hoodie"},{id:"star",name:"Star tee"},
           {id:"jumpi",name:"Jumpi tee"},{id:"tiedye",name:"Tie-dye"},{id:"galaxy",name:"Galaxy"},{id:"tux",name:"Tuxedo"}],
  pants:  [{id:"denim",name:"Jeans"},{id:"black",name:"Black joggers"},{id:"khaki",name:"Khaki shorts"},{id:"plaid",name:"Red plaid"},
           {id:"pink",name:"Pink jeans"},{id:"camo",name:"Camo"},{id:"rainbow",name:"Rainbow"},{id:"gold",name:"Gold shorts"}],
  glasses:[{id:"round",name:"Round"},{id:"square",name:"Square"},{id:"star",name:"Star party"},{id:"shades",name:"Sunglasses"},
           {id:"heart",name:"Heart"},{id:"neon",name:"Neon shades"},{id:"goldround",name:"Gold round"},{id:"monocle",name:"Monocle"}],
};
const outfit={hair:-1,shirt:-1,pants:-1,glasses:-1,tag:-1};
const OUTFIT_OBJ={hair:[],shirt:[],pants:[],glasses:[]};

function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
const clothMat=(tex,rough=.75)=>new THREE.MeshStandardMaterial({map:tex,roughness:rough,metalness:0,side:THREE.DoubleSide});
const solid=(hex,rough=.6,extra={})=>new THREE.MeshStandardMaterial({color:hex,roughness:rough,metalness:0,...extra});

// a slice of an ellipsoid (optionally pear-shaped like the body), used for clothes and hair shells
function shell({center,radii,scale=1,t0=0,t1=Math.PI,p0=0,pl=Math.PI*2,pear=0,mat,seg=[64,32],tiltX=0,rotZ=0}){
  const g=new THREE.SphereGeometry(1,seg[0],seg[1],p0,pl,t0,t1-t0);const a=g.attributes.position;const v=new THREE.Vector3();
  const e=new THREE.Euler(tiltX,0,rotZ);
  for(let i=0;i<a.count;i++){v.fromBufferAttribute(a,i);const k=1-pear*Math.max(v.y,0);
    v.set(v.x*k*radii[0]*scale,v.y*k*radii[1]*scale,v.z*k*radii[2]*scale).applyEuler(e);a.setXYZ(i,v.x+center[0],v.y+center[1],v.z+center[2]);}
  g.computeVertexNormals();return new THREE.Mesh(g,mat);
}
const blob=(r,pos,mat,scale=[1,1,1])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,20),mat);m.position.set(...pos);m.scale.set(...scale);return m;};

/* ----- shirt textures: canvas spans the whole way round (front = 25% across) ----- */
const SHIRT_FILL={red:"#e8423b",sailor:"#ffffff",hoodie:"#3fbf62",star:"#ffcf33",jumpi:"#1fb6ff",tiedye:"#ff7ad9",galaxy:"#24165c",tux:"#1c1c24"};
const SHIRT_HEM={red:"#a8231e",sailor:"#1d3d8f",hoodie:"#24853f",star:"#e39a12",jumpi:"#06488a",tiedye:"#7a3cff",galaxy:"#0d0824",tux:"#0b0b10"};
function starPath(x,cx,cy,R,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}x.closePath();}
function tieDye(x,w,h,cx,cy){const cols=["#ff4f8b","#ffb23f","#ffe94a","#4fe07a","#3fb8ff","#9a5cff"];
  for(let r=Math.max(w,h);r>0;r-=26){x.fillStyle=cols[(r/26|0)%cols.length];x.beginPath();
    for(let a=0;a<=Math.PI*2+.01;a+=.08){const rr=r*(1+.18*Math.sin(a*5+r*.03));x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.6);}x.fill();}}
function galaxySky(x,w,h,seed){const R=rng(seed);x.fillStyle="#24165c";x.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){const g=x.createRadialGradient(R()*w,R()*h,0,R()*w,R()*h,40+R()*60);g.addColorStop(0,R()<.5?"rgba(160,90,255,.55)":"rgba(40,200,255,.45)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,w,h);}
  x.fillStyle="#fff";for(let i=0;i<220;i++){const r=R()*2.2+.4;x.globalAlpha=.5+R()*.5;x.beginPath();x.arc(R()*w,R()*h,r,0,7);x.fill();}x.globalAlpha=1;}
function shirtTex(id){
  return canvasTex(1024,256,(x,w,h)=>{
    const fill=SHIRT_FILL[id],hem=SHIRT_HEM[id];
    x.fillStyle=fill;x.fillRect(0,0,w,h);
    if(id==="sailor"){x.fillStyle="#1d3d8f";for(let y=28;y<h;y+=46)x.fillRect(0,y,w,20);}
    if(id==="hoodie"){x.fillStyle=hem;x.beginPath();x.roundRect(w*.25-80,h*.6,160,h*.28,22);x.fill();
      x.strokeStyle="#e9fbe9";x.lineWidth=8;x.lineCap="round";[[-28],[28]].forEach(([d])=>{x.beginPath();x.moveTo(w*.25+d,0);x.lineTo(w*.25+d,h*.32);x.stroke();});}
    if(id==="star"){x.fillStyle="#ff6a1a";starPath(x,w*.25,h*.66,52,22);x.fill();}
    if(id==="jumpi"){const cx=w*.25,cy=h*.64;x.fillStyle="#ffffff";x.beginPath();x.arc(cx,cy,46,0,7);x.fill();
      x.fillStyle="#ff9a1f";x.font='bold 64px "Lilita One", sans-serif';x.textAlign="center";x.textBaseline="middle";x.fillText("J",cx+2,cy+4);
      x.fillStyle="#ffffff";x.fillRect(0,h*.36,w,8);}
    if(id==="tiedye"){tieDye(x,w,h,w*.25,h*.6);tieDye(x,w,h,w*.75,h*.6);}
    if(id==="galaxy"){galaxySky(x,w,h,7);x.fillStyle="#ffe46b";starPath(x,w*.25,h*.64,34,14);x.fill();}
    if(id==="tux"){const cx=w*.25;x.fillStyle="#ffffff";x.beginPath();x.moveTo(cx-70,0);x.lineTo(cx+70,0);x.lineTo(cx+34,h);x.lineTo(cx-34,h);x.closePath();x.fill();
      x.fillStyle="#1c1c24";for(let y=h*.58;y<h-30;y+=26){x.beginPath();x.arc(cx,y,6,0,7);x.fill();}
      x.fillStyle="#d61f3a";x.beginPath();x.moveTo(cx,h*.46);x.lineTo(cx-40,h*.36);x.lineTo(cx-40,h*.56);x.closePath();x.moveTo(cx,h*.46);x.lineTo(cx+40,h*.36);x.lineTo(cx+40,h*.56);x.closePath();x.fill();
      x.beginPath();x.arc(cx,h*.46,10,0,7);x.fill();}
    x.fillStyle=hem;x.fillRect(0,h-26,w,26);
  });
}
function sleeveTex(id){return canvasTex(256,128,(x,w,h)=>{
  x.fillStyle=SHIRT_FILL[id];x.fillRect(0,0,w,h);
  if(id==="sailor"){x.fillStyle="#1d3d8f";for(let y=10;y<h;y+=40)x.fillRect(0,y,w,16);}
  if(id==="tiedye")tieDye(x,w,h,w*.5,h*.5);
  if(id==="galaxy")galaxySky(x,w,h,3);
  x.fillStyle=SHIRT_HEM[id];x.fillRect(0,h-18,w,18);});}

function pantsTex(id){return canvasTex(512,256,(x,w,h)=>{
  const base={denim:"#3a6fd1",black:"#2a2d36",khaki:"#c9a46a",plaid:"#d8333a",pink:"#ff7fbf",camo:"#6b7f3a",rainbow:"#ff4f8b",gold:"#f2c230"}[id];x.fillStyle=base;x.fillRect(0,0,w,h);
  if(id==="pink"){x.strokeStyle="#ffffff";x.lineWidth=3;x.setLineDash([10,8]);[w*.25,w*.75].forEach(u=>{x.beginPath();x.moveTo(u,40);x.lineTo(u,h);x.stroke();});x.setLineDash([]);}
  if(id==="camo"){const R=rng(11),cols=["#4a5a24","#8a7a4a","#2f3a1a","#a3b06a"];for(let i=0;i<90;i++){x.fillStyle=cols[i%4];x.beginPath();x.ellipse(R()*w,R()*h,18+R()*30,10+R()*18,R()*3,0,7);x.fill();}}
  if(id==="rainbow"){const cols=["#ff4f8b","#ff9a1f","#ffe94a","#4fe07a","#3fb8ff","#9a5cff"];cols.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,30+i*(h-30)/6,w,(h-30)/6+1);});}
  if(id==="gold"){const g=x.createLinearGradient(0,0,w,0);for(let i=0;i<=8;i++)g.addColorStop(i/8,i%2?"#ffe27a":"#d9a21b");x.fillStyle=g;x.fillRect(0,0,w,h);}
  if(id==="denim"){x.strokeStyle="#f2b74a";x.lineWidth=3;x.setLineDash([10,8]);[w*.25,w*.75].forEach(u=>{x.beginPath();x.moveTo(u,40);x.lineTo(u,h);x.stroke();});x.setLineDash([]);}
  if(id==="black"){x.fillStyle="#ffffff";[w*.02,w*.48,w*.52,w*.98].forEach(u=>x.fillRect(u-4,0,8,h));}
  if(id==="plaid"){x.globalAlpha=.35;x.fillStyle="#2b1a1a";for(let i=0;i<w;i+=64)x.fillRect(i,0,22,h);for(let j=0;j<h;j+=64)x.fillRect(0,j,w,22);
    x.globalAlpha=.5;x.fillStyle="#ffd34d";for(let i=30;i<w;i+=64)x.fillRect(i,0,4,h);for(let j=30;j<h;j+=64)x.fillRect(0,j,w,4);x.globalAlpha=1;}
  x.fillStyle={denim:"#284f9c",black:"#16181e",khaki:"#9c7c47",plaid:"#8f1d22",pink:"#d94f95",camo:"#3a4720",rainbow:"#ffffff",gold:"#a3740a"}[id];x.fillRect(0,0,w,30);
});}

const HAIR_COL={spiky:["#3b2416","#5c3a22"],quiff:["#c98a3c","#e2aa5c"],pigtails:["#2a1a14","#4a2e22"],longbow:["#7a3b1c","#a2582e"]};
/* ---- hair helpers: everything is placed on the head ellipsoid in the Head node's space ---- */
const HC=new THREE.Vector3(0,0.42,0),HR=[0.66,0.58,0.56];
// point on (scaled) head surface; th = angle from the crown, ph = angle round from the front (+z)
const hp=(th,ph,s=1)=>new THREE.Vector3(Math.sin(th)*Math.sin(ph)*HR[0]*s,Math.cos(th)*HR[1]*s,Math.sin(th)*Math.cos(ph)*HR[2]*s).add(HC);
const hn=(th,ph)=>new THREE.Vector3(Math.sin(th)*Math.sin(ph)/HR[0],Math.cos(th)/HR[1],Math.sin(th)*Math.cos(ph)/HR[2]).normalize();
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}
// a tapered, slightly flattened lock of hair swept along a smooth curve
function lockGeo(pts,r0,flat=.72,seg=22,rad=9){
  const curve=new THREE.CatmullRomCurve3(pts,false,"centripetal"),fr=curve.computeFrenetFrames(seg,false),pos=[],idx=[];
  for(let i=0;i<=seg;i++){const t=i/seg,p=curve.getPointAt(t);
    const r=r0*(t<.18?.75+t/.18*.25:1-Math.pow((t-.18)/.82,1.35)*.96);
    const N=fr.normals[i],B=fr.binormals[i];
    for(let j=0;j<rad;j++){const a=j/rad*Math.PI*2,cx=Math.cos(a)*r,sy=Math.sin(a)*r*flat;pos.push(p.x+N.x*cx+B.x*sy,p.y+N.y*cx+B.y*sy,p.z+N.z*cx+B.z*sy);}}
  for(let i=0;i<seg;i++)for(let j=0;j<rad;j++){const a=i*rad+j,b=i*rad+(j+1)%rad,c=a+rad,d=b+rad;idx.push(a,b,c,b,d,c);}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
// soft, lumpy hair base with a real hairline: high at the forehead, lower at the sides, lowest at the nape
function capGeo(front,side,back,sc=1.16,lump=.03,freq=9){
  const nl=30,nlon=72,pos=[],idx=[];
  for(let i=0;i<=nl;i++){const t=i/nl;
    for(let j=0;j<=nlon;j++){const ph=-Math.PI+2*Math.PI*j/nlon,c=Math.cos(ph);
      const tmax=c>0?side+(front-side)*Math.pow(c,1.2):side+(back-side)*Math.pow(-c,1.2),th=t*tmax;
      const k=sc*(1+lump*(0.6+0.4*Math.sin(ph*freq+th*4))*Math.sin(th*2.5+.5)+.012*Math.sin(ph*17));
      pos.push(Math.sin(th)*Math.sin(ph)*HR[0]*k+HC.x,Math.cos(th)*HR[1]*k+HC.y,Math.sin(th)*Math.cos(ph)*HR[2]*k+HC.z);}}
  for(let i=0;i<nl;i++)for(let j=0;j<nlon;j++){const a=i*(nlon+1)+j;idx.push(a,a+nlon+1,a+1,a+1,a+nlon+1,a+nlon+2);}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
function hairMats(id,cols){return (cols||HAIR_COL[id]).map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.05,side:THREE.DoubleSide}));}

function buildHair(id,cols){
  const g=new THREE.Group(),[m1,m2]=hairMats(id,cols),R=rng(id.length*977+13);
  const add=(pts,r,i,flat=.72)=>g.add(new THREE.Mesh(lockGeo(pts,r,flat),i%3===1?m2:m1));
  if(id==="spiky"){
    g.add(new THREE.Mesh(capGeo(0.95,1.45,1.75),m1));
    // spikes radiate from the crown and lean back
    [[0.15,3],[0.55,6],[0.95,8]].forEach(([th,n],ri)=>{
      for(let k=0;k<n;k++){const ph=(k/n)*Math.PI*2+ri*.5;if(th>0.9&&Math.cos(ph)>0.4)continue;
        const root=hp(th,ph,1.05),nn=hn(th,ph),dir=nn.clone().add(V3(0,.7,-.55)).normalize(),L=.44+R()*.18;
        add([root,root.clone().addScaledVector(nn,.14).addScaledVector(dir,L*.3),root.clone().addScaledVector(dir,L*.75).addScaledVector(nn,.05),root.clone().addScaledVector(dir,L).add(V3(0,-.03,-.1))],.17,k);}});
    // short fringe pointing forward over the forehead
    [-0.6,-0.3,0,0.3,0.6].forEach((ph,k)=>{const root=hp(0.62,ph,1.03);
      add([root,hp(0.88,ph*1.05,1.2),hp(1.02,ph*1.15,1.24).add(V3(0,.07,.08))],.11,k);});
  }
  if(id==="quiff"){
    g.add(new THREE.Mesh(capGeo(1.0,1.45,1.75),m1));
    // locks sweep over the top from a side parting on the left
    for(let k=0;k<9;k++){const th=0.35+k*0.085;
      add([hp(th,-1.05,1.02),hp(th*.75,-0.35,1.17),hp(th*.8+.12,0.45,1.18),hp(th+.18,1.15,1.1)],.11,k,.55);}
    // big wave at the front, rising up and curling back
    [-0.5,-0.25,0,0.25,0.5].forEach((ph,k)=>{const r=hp(0.6,ph*.6,1.06);
      add([r,hp(0.88,ph*.8,1.26).add(V3(0,.04,0)),hp(0.78,ph*.9+.12,1.4).add(V3(0,.1,.02)),hp(0.55,ph+.25,1.32).add(V3(0,.06,0))],.15,k,.5);});
    // tidy back

  const ts=1+Math.sin(t*6)*.04;ctx.save();ctx.translate(W/2,690);ctx.scale(ts,ts);ctx.rotate(-.04);ctx.translate(-W/2,-690);
  letterLine(t,"TODAY!",690,200,19.75,["#ffd23a","#ff9a1f"],.07);ctx.restore();
  if(k>1.5){const s=elastic(clamp01((k-1.5)/.6))*(1+Math.sin(t*6)*.03),bw=760,bh=130;ctx.save();ctx.translate(W/2,1600);ctx.scale(s,s);
    ctx.fillStyle="#1f3a7a";rr(-bw/2,-bh/2+12,bw,bh,65);ctx.fill();ctx.fillStyle="#ffffff";rr(-bw/2,-bh/2,bw,bh,65);ctx.fill();
    ctx.fillStyle="#ff9a1f";ctx.beginPath();ctx.arc(-bw/2+70,0,42,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(-bw/2+58,-22);ctx.lineTo(-bw/2+90,0);ctx.lineTo(-bw/2+58,22);ctx.closePath();ctx.fill();
    setFont(64);ctx.fillStyle="#1f6fd6";ctx.fillText("jumpigames.com",40,4);ctx.restore();}
  if(k>1.9){const a=ease((k-1.9)/.6);ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-a)*30);
ctx.restore();}
}
function draw2D(t,dt){
  const sc=sceneAt(t);
  if(sc==="run"&&(t<4.9||t>5.7)){ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle="#ffffff";ctx.lineCap="round";ctx.lineWidth=6;
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2+t*.3,r0=560+((t*900+i*137)%600),r1=r0+140;
      ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r0,H*.46+Math.sin(a)*r0*1.6);ctx.lineTo(W/2+Math.cos(a)*r1,H*.46+Math.sin(a)*r1*1.6);ctx.stroke();}ctx.restore();}
  if(sc==="run"){caption(t,["DRESS UP!"],"#ff9a1f",0,1.05,300,150);for(const s of STEPS)caption(t,[s.caption],s.col,s.t,s.t+.8);
    caption(t,["RACE HOME!"],"#ff5fb4",5.3,7.3);}
  if(sc==="home")caption(t,["DESIGN","YOUR HOME!"],"#ff9a1f",7.55,11.3,250,140);
  if(sc==="trade"){drawTrade(t);caption(t,["TRADE ITEMS!"],"#1fb6ff",11.55,15.1,250,140);}
  if(sc==="pet")caption(t,["ADOPT","YOUR PET!"],"#ff4f8b",15.35,18.7,250,140);
  // particle events
  STEPS.forEach((s,i)=>once("step"+i,t,s.t,()=>{S.pop();S.sparkle();const [x,y]=screenObj(me.head,.4);burst(x,y,s.col);}));
  once("paint",t,7.9,()=>{S.paint();burst(W/2,700,"#ffd23a",50);});
  FURN.forEach((f,i)=>once("fs"+i,t,f.userData.t,()=>{f.userData.drop?S.fall():S.pop();}));
  FURN.forEach((f,i)=>once("f"+i,t,f.userData.t+.15,()=>{f.userData.drop?S.thud():S.sparkle();const [x,y]=screenObj(f,.4);burst(x,y,PAL[i%7],24);}));
  once("deal",t,SWAP_T,()=>{S.deal();burst(W/2,640,"#22c55e",50);const [x,y]=screenObj(me.head,.5);burst(x,y,"#ff4f8b",30);});
  once("pop",t,16.3,()=>{S.pop();S.chime();const [x,y]=screenObj(gift,.6);burst(x,y,"#ffd23a",50);heartBurst(x,y-80,14);});
  if(sc==="pet"&&t>16.6&&Math.random()<dt*5){const [x,y]=screenObj(petHead,.5);heartBurst(x,y,1,.6);}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i],f=dt*60;p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=.9*f;p.vx*=Math.pow(.97,f);p.life-=dt*1.4;p.rot+=.1*f;
    if(p.life<=0){sparks.splice(i,1);continue;}ctx.globalAlpha=p.life;ctx.fillStyle=p.col;starPath2(ctx,p.x,p.y,p.r,p.r*.45,p.rot);ctx.fill();}
  for(let i=hearts.length-1;i>=0;i--){const p=hearts[i],f=dt*60;p.y+=p.vy*f;p.x+=Math.sin(t*4+p.ph)*1.5*f;p.life-=dt*.7;
    if(p.life<=0){hearts.splice(i,1);continue;}ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;heartPath(ctx,p.x,p.y,p.s);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#ffffff";ctx.stroke();}
  ctx.globalAlpha=1;
  if(sc==="final"){
    if(confetti.length<170&&t>19.1)for(let i=0;i<Math.round(dt*240);i++)confetti.push({x:Math.random()*W,y:-40,vy:6+Math.random()*7,vx:(Math.random()-.5)*4,r:Math.random()*6,s:12+Math.random()*12,c:PAL[i%7]});
    for(const c of confetti){const f=dt*60;c.y+=c.vy*f;c.x+=(c.vx+Math.sin(c.y*.02)*1.5)*f;c.r+=.1*f;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);ctx.restore();}
    drawFinal(t);}
  wipe(t);
}

let exporting=false;
function renderAt(t,dt){Snd.sync(t);soundTick(t);update3D(t,dt);renderer.render(scene,cam);ctx.drawImage(renderer.domElement,0,0,W,H);draw2D(t,dt);}
function frame(){
  if(exporting)return requestAnimationFrame(frame);
  let t=frozen??(performance.now()-start)/1000;
  if(t>=DUR){if(recording)finishRecording();restart();t=0;}
  const dt=Math.min(.05,Math.max(0,t-lastT));lastT=t;
  document.getElementById("prog").style.width=(t/DUR*100)+"%";
  renderAt(t,dt);
  requestAnimationFrame(frame);
}

/* timed sounds that aren't tied to a particle burst */
let lastStepK=-1,lastRattle=-1;
function soundTick(t){
  CUTS.forEach((c,i)=>once("wipe"+i,t,c.t-.35,()=>S.whoosh()));
  [[0,"pop"],[5.3,"pop"],[7.55,"pop"],[11.55,"pop"],[15.35,"pop"]].forEach(([t0,s],i)=>once("cap"+i,t,t0,()=>S[s]()));
  once("turn",t,5,()=>S.hop());
  once("card1",t,11.8,()=>S.card());once("card2",t,12.05,()=>S.card());once("arrows",t,12.2,()=>S.tick());once("swap",t,12.9,()=>S.whoosh());
  once("hopA",t,SWAP_T+.5,()=>S.hop());once("petjump",t,16.35,()=>S.hop());
  [16.75,17.6,18.3].forEach((t0,i)=>once("woof"+i,t,t0,()=>S.woof()));
  once("logo",t,18.95,()=>S.fanfare());once("pill",t,20.3,()=>S.pop());
  const running=t<5||(t>5.6&&t<7.4),k=Math.floor(t*13/Math.PI);
  if(running&&k!==lastStepK)S.step();lastStepK=k;
  const r=Math.floor(t/.09);if(t>15.5&&t<16.3&&r!==lastRattle)S.rattle();lastRattle=r;
}

/* ---------- load, then start ---------- */
await Promise.all([document.fonts.load('100px "Lilita One"'),document.fonts.load('600 60px "Fredoka"'),new Promise(r=>{logo.onload=r;logo.onerror=r;if(logo.complete)r();})]);
[me,fr]=await Promise.all([loadChar(),loadChar()]);
OUTFIT_PARTS.hair[5].col=["#f0b92e","#ffd768"];
frObj=buildFor(fr);dress(fr,frObj,FRIEND_LOOK);buildDress(fr);
meObj=buildFor(me);
restart();requestAnimationFrame(frame);

/* ---------- recording to a video file ---------- */
const recBtn=document.getElementById("rec"),statusEl=document.getElementById("status");
function pickType(){for(const m of["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm"])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return "";}
let chunks=[];
recBtn.onclick=async()=>{
  if(recording)return;await Snd.unlock();const type=pickType();
  if(!type){statusEl.textContent="This browser can't record video. Try Chrome.";return;}
  const stream=out.captureStream(30);if(Snd.stream)Snd.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));chunks=[];
  recording=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:12_000_000});
  recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recording.onstop=()=>{const blob=new Blob(chunks,{type:recording.mimeType||type}),ext=type.includes("mp4")?"mp4":"webm";
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jumpi-story."+ext;a.click();
    statusEl.textContent=`Saved jumpi-story.${ext} (${(blob.size/1e6).toFixed(1)} MB).`+(ext==="webm"?" Convert to MP4 before uploading to Instagram.":"");
    recording=null;recBtn.classList.remove("on");recBtn.disabled=false;document.getElementById("recLabel").textContent="Record (real time)";};
  restart();recording.start(250);recBtn.classList.add("on");recBtn.disabled=true;document.getElementById("recLabel").textContent="Recording…";
  statusEl.textContent=`Recording ${DUR} seconds. Keep this tab visible.`;
};
/* ---------- offline export: every frame rendered and encoded, with the soundtrack ---------- */
const dlBtn=document.getElementById("dl"),dlLabel=document.getElementById("dlLabel"),prog=document.getElementById("prog");
const yieldUI=()=>new Promise(r=>{const ch=new MessageChannel();ch.port1.onmessage=()=>r();ch.port2.postMessage(0);});
async function pickVideo(w,h){for(const codec of["avc1.640032","avc1.4d0032","avc1.42003e"]){const c={codec,width:w,height:h,bitrate:14_000_000,framerate:30,avc:{format:"avc"}};
  try{if((await VideoEncoder.isConfigSupported(c)).supported)return {kind:"mp4",cfg:c};}catch{}}
  const c={codec:"vp09.00.40.08",width:w,height:h,bitrate:14_000_000,framerate:30};try{if((await VideoEncoder.isConfigSupported(c)).supported)return {kind:"webm",cfg:c};}catch{}return null;}
async function exportVideo(){
  if(exporting||recording)return;
  if(!window.VideoEncoder||!window.AudioEncoder||!window.OfflineAudioContext){statusEl.textContent="This browser can't make the file. Use Chrome or Edge, or try Record.";return;}
  exporting=true;dlBtn.disabled=recBtn.disabled=true;
  try{
    const FPS=30,N=Math.round(DUR*FPS);
    const v=await pickVideo(W,H);if(!v)throw new Error("no video encoder");
    let aCfg={codec:v.kind==="mp4"?"mp4a.40.2":"opus",sampleRate:48000,numberOfChannels:2,bitrate:192000};
    if(!(await AudioEncoder.isConfigSupported(aCfg)).supported){aCfg=null;}
    statusEl.textContent="Loading the video maker…";
    const lib=v.kind==="mp4"?await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"):await import("https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/build/webm-muxer.mjs");
    const muxer=new lib.Muxer({target:new lib.ArrayBufferTarget(),
      video:v.kind==="mp4"?{codec:"avc",width:W,height:H,frameRate:FPS}:{codec:"V_VP9",width:W,height:H,frameRate:FPS},
      ...(aCfg?{audio:v.kind==="mp4"?{codec:"aac",numberOfChannels:2,sampleRate:48000}:{codec:"A_OPUS",numberOfChannels:2,sampleRate:48000}}:{}),
      ...(v.kind==="mp4"?{fastStart:"in-memory"}:{})});
    statusEl.textContent="Making the video. Keep this tab open.";
    let fail=null;
    const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>fail=e});venc.configure(v.cfg);
    // pictures (the soundtrack is built at the same time, frame by frame)
    restart();Snd.beginOffline();
    for(let i=0;i<N;i++){
      if(fail)throw fail;const t=i/FPS;Snd.setTime(t);renderAt(t,i?1/FPS:0);
      const vf=new VideoFrame(out,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});venc.encode(vf,{keyFrame:i%60===0});vf.close();
      while(venc.encodeQueueSize>6)await new Promise(r=>venc.addEventListener("dequeue",r,{once:true}));
      if(i%5===0){prog.style.width=(i/N*90)+"%";dlLabel.textContent=`Making video… ${Math.round(i/N*90)}%`;await yieldUI();}
    }
    await venc.flush();venc.close();
    // sound
    const buf=await Snd.endOffline();
    if(aCfg){const aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>fail=e});aenc.configure(aCfg);
      const L=buf.getChannelData(0),Rr=buf.getChannelData(1),len=Math.min(buf.length,Math.round(DUR*48000)),B=1024;
      for(let s=0;s<len;s+=B){const n=Math.min(B,len-s),d=new Float32Array(n*2);d.set(L.subarray(s,s+n),0);d.set(Rr.subarray(s,s+n),n);
        const ad=new AudioData({format:"f32-planar",sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(s/48000*1e6),data:d});aenc.encode(ad);ad.close();}
      await aenc.flush();aenc.close();if(fail)throw fail;}
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:v.kind==="mp4"?"video/mp4":"video/webm"}),name="jumpi-story."+v.kind;
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    prog.style.width="100%";
    statusEl.textContent=`Saved ${name} (${(blob.size/1e6).toFixed(1)} MB)`+(aCfg?"":" without sound — this browser can't encode audio")+(v.kind==="webm"?". Convert to MP4 for Instagram.":".");
  }catch(err){console.error(err);statusEl.textContent="Couldn't make the video here. Try Chrome or Edge, or use Record.";try{Snd.endOffline();}catch{}}
  finally{exporting=false;dlBtn.disabled=recBtn.disabled=false;dlLabel.textContent="Download HD video";restart();}
}
dlBtn.onclick=exportVideo;
function finishRecording(){if(recording&&recording.state!=="inactive")recording.stop();}
const sndBtn=document.getElementById("snd");
sndBtn.onclick=async()=>{await Snd.unlock();Snd.setOn(!Snd.on);sndBtn.textContent=Snd.on?"🔊 Sound on":"🔇 Sound off";sndBtn.setAttribute("aria-pressed",Snd.on);if(Snd.on&&!recording)restart();};
document.getElementById("replay").onclick=()=>{if(!recording)restart();};
</script>
