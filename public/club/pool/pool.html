<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jumpi Club · Billiards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&display=swap">
<link rel="stylesheet" href="/club/pool/pool.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
<!-- Jumpi Club: billiards (8-ball pool) against Jumpi Bot, just for fun: no coins -->
<header class="sn-top">
  <button class="sn-back" id="snBack" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="snBackT"></span></button>
  <h1 id="snTitle"></h1>
  <button class="sn-snd" id="snSnd" type="button" aria-pressed="true"></button>
</header>
<div class="sn-hud" id="snHud" hidden>
  <div class="sn-p" id="snP0"><span class="sn-av" id="snAv0"></span><span class="sn-pn"><b id="snN0"></b><small id="snS0">0</small></span></div>
  <div class="sn-mid"><span class="sn-on" id="snOn"></span><small id="snInfo"></small></div>
  <div class="sn-p" id="snP1"><span class="sn-av" id="snAv1"></span><span class="sn-pn"><b id="snN1"></b><small id="snS1">0</small></span></div>
</div>
<main class="sn-stage" id="snStage">
  <canvas id="snCanvas"></canvas>
  <div class="sn-power" id="snPower" hidden><div class="sn-pw-track" id="snPwTrack"><i id="snPwFill"></i><span class="sn-pw-knob" id="snPwKnob"></span></div><small id="snPwT"></small></div>
  <div class="sn-fine" id="snFine" hidden><button type="button" id="snL" aria-label="Aim left">‹</button><button type="button" id="snR" aria-label="Aim right">›</button></div>
  <div class="sn-msg" id="snMsg" hidden></div>
</main>
<div class="sn-screen" id="snStart" hidden></div>
<div class="sn-screen" id="snEnd" hidden></div>
<script type="module" src="/club/pool/pool.js"></script>
</body>
</html>
