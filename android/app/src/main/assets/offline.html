<title>Jumpi Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:grid;place-items:center;padding:16px;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#22324a;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 40%,#7fd8ff,#1f8fff 55%,#0a4fc0)}
.card{display:flex;align-items:center;gap:22px;max-width:620px;width:100%;padding:20px 24px;border-radius:28px;background:linear-gradient(180deg,#fff,#eef4ff);box-shadow:0 8px 0 #9fb8e6,0 24px 50px rgb(0 0 0 / .3)}
img{width:120px;height:120px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
h1{margin:0 0 6px;font-size:1.7rem;font-weight:900;letter-spacing:.02em;color:#ff5fb4;text-shadow:0 3px 0 #ffd3ea}
p{margin:0 0 14px;font-size:1rem;line-height:1.4;color:#4a5b75}
button{height:52px;padding:0 30px;border:0;border-radius:26px;font-size:1.15rem;font-weight:800;letter-spacing:.05em;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ffb84a,#ff8a1c 55%,#e06a00);box-shadow:inset 0 3px 0 rgb(255 255 255 / .45),0 5px 0 #a3410a}
button:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgb(255 255 255 / .45),0 2px 0 #a3410a}
@media (max-height:380px){img{width:90px;height:90px}h1{font-size:1.4rem}}
</style></head>
