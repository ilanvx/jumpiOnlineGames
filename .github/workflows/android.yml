# Builds the Jumpi Games Android app (android/) on every push to this branch (android-app).
# The APK (to install on a phone) and the AAB (for Google Play) are published to the branch "android-build"
# together with the build log, and also attached to the run as an artifact.
name: Android app

on:
  push:
    branches: [android-app]
    paths-ignore: ["desktop/**", ".github/workflows/desktop.yml", "ios/**", ".github/workflows/ios.yml", "README-DESKTOP.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK + AAB (everything in one step, so the whole log lands in build-log.txt)
        id: build
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUN: ${{ github.run_number }}
        run: |
          set -o pipefail
          (
            set -e
            echo "== Java"; java -version
            echo "== Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)
            echo "sdkmanager: $SDKM"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
            echo "== Gradle 8.11.1"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH=/tmp/gradle-8.11.1/bin:$PATH
            gradle --version
            # every build gets a higher version number (Google Play needs that for each upload)
            export APP_VERSION_CODE=$((RUN + 100)) APP_VERSION_NAME="1.0.$RUN"
            echo "== Version $APP_VERSION_NAME ($APP_VERSION_CODE)"
            if [ -n "$KS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "$KS" | tr -d ' \r\n' | base64 -d > android/release.keystore
              # a .p12 from tools/make-upload-key.ps1 (or an old .jks): find its type and the key's name by itself
              export ANDROID_STORE_TYPE=pkcs12
              keytool -list -keystore android/release.keystore -storetype pkcs12 -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/ks.txt 2>&1 || { export ANDROID_STORE_TYPE=jks; keytool -list -keystore android/release.keystore -storetype jks -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/ks.txt 2>&1; }
              export ANDROID_KEY_ALIAS=$(grep -i "PrivateKeyEntry" /tmp/ks.txt | head -1 | cut -d, -f1)
              echo "== Signing with the upload key (type $ANDROID_STORE_TYPE, key \"$ANDROID_KEY_ALIAS\")"
              [ -n "$ANDROID_KEY_ALIAS" ] || { echo "!! the key file or its password is wrong"; cat /tmp/ks.txt | grep -v -i password; exit 1; }
            else echo "== No upload key yet: debug signing (fine for installing the APK, NOT for Google Play)"; fi
            cd android
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
          ) 2>&1 | tee build-log.txt

      - name: Publish to the android-build branch
        if: always()
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          mkdir -p out
          cp build-log.txt out/ 2>/dev/null || echo "no build log" > out/build-log.txt
          cp android/app/build/outputs/apk/release/*.apk out/jumpi-games.apk 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab out/jumpi-games.aab 2>/dev/null || true
          SIGNED=$([ "$HAS_KEY" = "true" ] && echo "upload key (ready for Google Play)" || echo "debug key (not for Google Play)")
          printf "status: %s\nrun: %s\nversion: 1.0.%s (%s)\nsigned with: %s\ncommit: %s\ndate: %s\n" "${{ steps.build.outcome }}" "${{ github.run_number }}" "${{ github.run_number }}" "$((${{ github.run_number }} + 100))" "$SIGNED" "${{ github.sha }}" "$(date -u)" > out/BUILD_INFO.txt
          cd out
          git init -q -b android-build
          git add -A
          git -c user.name="Jumpi build" -c user.email="build@jumpigames.com" commit -qm "Android build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jumpi-games-android
          path: out/
