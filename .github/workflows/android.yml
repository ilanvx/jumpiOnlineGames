# Builds the Jumpi Games Android app (android/) on every push to this branch (android-app).
# The APK (to install on a phone) and the AAB (for Google Play) are published to the branch "android-build"
# together with the build log, and also attached to the run as an artifact.
name: Android app

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK + AAB (everything in one step, so the whole log lands in build-log.txt)
        id: build
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          (
            set -e
            echo "== Java"; java -version
            echo "== Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)
            echo "sdkmanager: $SDKM"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
            echo "== Gradle 8.9"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH=/tmp/gradle-8.9/bin:$PATH
            gradle --version
            if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/release.jks; echo "== Signing with the release key"; else echo "== No release key yet: debug signing"; fi
            cd android
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
          ) 2>&1 | tee build-log.txt

      - name: Publish to the android-build branch
        if: always()
        run: |
          mkdir -p out
          cp build-log.txt out/ 2>/dev/null || echo "no build log" > out/build-log.txt
          cp android/app/build/outputs/apk/release/*.apk out/jumpi-games.apk 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab out/jumpi-games.aab 2>/dev/null || true
          printf "status: %s\nrun: %s\ncommit: %s\ndate: %s\n" "${{ steps.build.outcome }}" "${{ github.run_number }}" "${{ github.sha }}" "$(date -u)" > out/BUILD_INFO.txt
          cd out
          git init -q -b android-build
          git add -A
          git -c user.name="Jumpi build" -c user.email="build@jumpigames.com" commit -qm "Android build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jumpi-games-android
          path: out/
